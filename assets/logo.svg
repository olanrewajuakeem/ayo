<!--
  Ayo is a Yoruba board game: two rows of pits, seeds moved between them, and
  the whole skill is deciding which pit to play from. Cowrie shells were both
  the currency and the pieces.

  That is the agent, almost literally. Five corridors are five pits, the
  capital is the seeds, and the only decision that matters is which pit is
  worth playing. So the mark is a board mid-game: two pits holding seeds,
  three standing empty, and one move in flight between them — which is what
  the scanner reports on a typical day.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ayo">
  <rect width="512" height="512" rx="104" fill="#0C1B14"/>

  <!-- Ten pits, two rows of five. Spaced so they read as separate wells. -->
  <g fill="none" stroke="#2C4A3B" stroke-width="9">
    <circle cx="112" cy="190" r="30"/>
    <circle cx="184" cy="190" r="30"/>
    <circle cx="256" cy="190" r="30"/>
    <circle cx="328" cy="190" r="30"/>
    <circle cx="400" cy="190" r="30"/>

    <circle cx="112" cy="322" r="30"/>
    <circle cx="184" cy="322" r="30"/>
    <circle cx="256" cy="322" r="30"/>
    <circle cx="328" cy="322" r="30"/>
    <circle cx="400" cy="322" r="30"/>
  </g>

  <!-- The two pits in play. Three seeds in one, two in the other. -->
  <g fill="#CFFF5E">
    <circle cx="184" cy="178" r="9"/>
    <circle cx="172" cy="199" r="9"/>
    <circle cx="196" cy="199" r="9"/>

    <circle cx="320" cy="313" r="9"/>
    <circle cx="337" cy="330" r="9"/>
  </g>

  <!-- The move: one arc from a spent pit to the pit worth playing. -->
  <path d="M112 228 C 120 300, 210 368, 300 334"
        fill="none" stroke="#CFFF5E" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="1 20" opacity="0.9"/>
</svg>
